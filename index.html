<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aditya Kumar | Connect With Me</title>

  <meta name="description"
    content="Connect with Aditya Kumar on Instagram, Snapchat and Email.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at top left, #35206c, transparent 50%),
        radial-gradient(ellipse at bottom right, #123c60, transparent 50%),
        #090914;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 38px 26px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      background: rgba(255,255,255,0.06);
      box-shadow: 0 20px 70px rgba(0,0,0,0.4);
      backdrop-filter: blur(18px);
    }

    .avatar {
      width: 94px;
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      font-size: 30px;
      font-weight: bold;
      background: linear-gradient(135deg, #a855f7, #38bdf8);
      border: 3px solid rgba(255,255,255,0.7);
      box-shadow: 0 0 30px rgba(168,85,247,0.3);
    }

    h1 {
      font-size: 29px;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #c3c3d6;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 15px 17px;
      margin-top: 13px;
      color: white;
      text-decoration: none;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 15px;
      background: rgba(255,255,255,0.07);
      transition: transform 0.2s, background 0.2s;
    }

    .social-link:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.14);
    }

    .emoji {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-size: 21px;
      background: rgba(255,255,255,0.1);
    }

    .link-title {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .link-description {
      display: block;
      font-size: 12px;
      color: #b9b9cd;
    }

    .arrow {
      margin-left: auto;
      color: #c7c7df;
      font-size: 20px;
    }

    footer {
      margin-top: 28px;
      font-size: 12px;
      color: #9e9eb7;
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="avatar">AK</div>

    <h1>Aditya Kumar</h1>

    <p class="subtitle">
      Hey! Welcome to my space 👋<br>
      Connect with me on social media.
    </p>

    <!-- INSTAGRAM LINK: yahan apna link bharo -->
    <a class="social-link"
       href="https://instagram.com/ad_gupta007_?xtok=MTF6Mmw2dXE2dXFkZg%3D%3D&utm_source=qr"Instagram
       target="_blank"
       rel="noopener noreferrer">

      <span class="emoji">📸</span>
      <span>
        <span class="link-title">Instagram</span>
        <span class="link-description">Follow me on Instagram</span>
      </span>
      <span class="arrow">↗</span>
    </a>

    <!-- SNAPCHAT LINK: yahan apna link bharo -->
    <a class="social-link"
       href="https://snapchat.com/t/Bsir4ulO"snapchat
       target="_blank"
       rel="noopener noreferrer">

      <span class="emoji">👻</span>
      <span>
        <span class="link-title">Snapchat</span>
        <span class="link-description">Let's connect on Snap</span>
      </span>
      <span class="arrow">↗</span>
    </a>

    <!-- EMAIL: yahan apna email bharo -->
    <a class="social-link"
       href="mailto:ucbachaoaandolan1@gail.com">email

      <span class="emoji">✉️</span>
      <span>
        <span class="link-title">Email Me</span>
        <span class="link-description">Send me an email</span>
      </span>
      <span class="arrow">↗</span>
    </a>

    <footer>
      Made with ❤️ by Aditya Kumar
    </footer>

  </main>
</body>
</html>
